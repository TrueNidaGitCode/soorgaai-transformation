<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__APP_NAME__</title>

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="app.css">

  <script src="config.js"></script>
</head>
<body>

  <div class="ch-app">

    <header class="ch-head">
      <div class="ch-head__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-5a8.4 8.4 0 0 1-.9-3.9 8.4 8.4 0 0 1 8.4-8.4h.6A8.4 8.4 0 0 1 21 11v.5z"/>
        </svg>
      </div>
      <div class="ch-head__text">
        <h1 class="ch-head__title">__APP_NAME__</h1>
        <p class="ch-head__sub">Describe a failure and I'll find similar defects and a likely cause.</p>
      </div>
      <span class="ch-head__state" id="ch-state"><span class="ch-head__dot"></span>Connecting…</span>
    </header>

    <div class="ch-log" id="ch-log" role="log" aria-live="polite">
      <!-- Opening turn. Not a fake message from the assistant — it is
           labelled as the app introducing itself, with real examples the
           user can click rather than an empty box and a blinking cursor. -->
      <div class="ch-welcome">
        <h2 class="ch-welcome__title">What went wrong?</h2>
        <p class="ch-welcome__body">
          Paste a test failure, an error, or a symptom. This searches your
          historical defect records for the closest matches and drafts a
          likely root cause from them.
        </p>
        <div class="ch-examples" id="ch-examples">
          <button type="button" class="ch-example">Flash attempt on the gateway ECU failed after transfer; checksum verification did not match.</button>
          <button type="button" class="ch-example">OTA update stalls at 40% on the telematics unit and then times out.</button>
          <button type="button" class="ch-example">Diagnostic session drops during reprogramming when the vehicle is on battery power.</button>
        </div>
      </div>
    </div>

    <form class="ch-compose" id="ch-form">
      <textarea id="ch-input" class="ch-compose__input" rows="1"
                placeholder="Describe the failure…" aria-label="Describe the failure"></textarea>
      <button type="submit" class="ch-compose__send" id="ch-send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </form>

    <p class="ch-foot">Built with Svarg</p>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
