<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__APP_NAME__</title>

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="app.css">

  <script src="config.js"></script>
</head>
<body>

  <div class="ch-app">

    <header class="ch-head">
      <div class="ch-head__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-5a8.4 8.4 0 0 1-.9-3.9 8.4 8.4 0 0 1 8.4-8.4h.6A8.4 8.4 0 0 1 21 11v.5z"/>
        </svg>
      </div>
      <div class="ch-head__text">
        <h1 class="ch-head__title">__APP_NAME__</h1>
        <p class="ch-head__sub">__APP_TAGLINE__</p>
      </div>
      <span class="ch-head__state" id="ch-state"><span class="ch-head__dot"></span>Connecting…</span>
    </header>

    <div class="ch-log" id="ch-log" role="log" aria-live="polite">
      <!-- Opening turn. Not a fake message from the assistant — it is the
           app introducing itself.

           The copy is filled from the blueprint rather than written here.
           This file ships to every customer, and it used to ask all of them
           about ECU flash failures whatever their application actually did.
           #ch-examples is left empty for the generated app.js to fill, since
           only it knows what a useful question looks like for this use case. -->
      <div class="ch-welcome">
        <h2 class="ch-welcome__title">__APP_WELCOME_TITLE__</h2>
        <p class="ch-welcome__body">__APP_WELCOME_BODY__</p>
        <div class="ch-examples" id="ch-examples"></div>
      </div>
    </div>

    <form class="ch-compose" id="ch-form">
      <textarea id="ch-input" class="ch-compose__input" rows="1"
                placeholder="__APP_PROMPT__" aria-label="__APP_PROMPT__"></textarea>
      <button type="submit" class="ch-compose__send" id="ch-send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </form>

    <p class="ch-foot">Built with Svarg</p>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
