<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="dashboard.css?v=1">
    <script src="../login/config.js"></script>
</head>
<body class="ad-body">
    <!--
      The admin home.

      It used to be a form for creating and editing "signals" — city-level AI
      infrastructure notes for an assessment product that no longer exists.
      Two hundred and fifty lines of markup and five hundred of script, all of
      it calling CONFIG.ADMIN.CREATE_SIGNAL and friends, none of which are in
      config.js and none of which have a route on the server. It had been
      broken for long enough that nobody noticed it was broken.

      What an admin home owes somebody is a way in and a way out.
    -->
    <main class="ad">
        <header class="ad__top">
            <div>
                <p class="ad__eyebrow">Svarg</p>
                <h1 class="ad__h1">Admin</h1>
            </div>
            <div class="ad__who">
                <span id="ad-user">&mdash;</span>
                <button type="button" id="ad-logout" class="ad__out">Log out</button>
            </div>
        </header>

        <nav class="ad__cards">
            <a class="ad__card" href="/admin/sales.html">
                <h2>Sales</h2>
                <p>Who we sell to, the playbook that tests it, the interview, the target audience
                   table, what to say in the room, and the funnel.</p>
                <span class="ad__go">Open &rarr;</span>
            </a>

            <a class="ad__card" href="/admin/capital.html">
                <h2>Capital</h2>
                <p>The investor deck, with the proof slide measured from the live databases each
                   time it is opened.</p>
                <span class="ad__go">Open &rarr;</span>
            </a>
        </nav>
    </main>

    <script src="dashboard.js?v=2"></script>
</body>
</html>
