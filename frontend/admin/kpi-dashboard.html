<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company KPIs - SOORGA</title>
    <script src="../login/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dashboard-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .dashboard-header .timestamp {
            color: #888;
            font-size: 0.9rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 30px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #888;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.2);
        }

        .kpi-card .label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .kpi-card .value {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .kpi-card .subtext {
            font-size: 0.85rem;
            color: #aaa;
        }

        .kpi-card.highlight {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-color: rgba(102, 126, 234, 0.3);
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        /* User Table */
        .users-table-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .users-table th,
        .users-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .users-table th {
            color: #888;
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            background: #1a1a2e;
        }

        .users-table td {
            color: #ddd;
            font-size: 0.9rem;
        }

        .users-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Status badges */
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-high {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
        }

        .badge-medium {
            background: rgba(237, 137, 54, 0.2);
            color: #ed8936;
        }

        .badge-low {
            background: rgba(160, 174, 192, 0.2);
            color: #a0aec0;
        }

        .badge-active {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
        }

        .badge-engaged {
            background: rgba(66, 153, 225, 0.2);
            color: #4299e1;
        }

        .badge-dormant {
            background: rgba(237, 137, 54, 0.2);
            color: #ed8936;
        }

        .badge-inactive {
            background: rgba(160, 174, 192, 0.2);
            color: #a0aec0;
        }

        .score-bar {
            width: 60px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(255, 107, 107, 0.2);
        }

        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }

        .summary-card .text {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .dashboard-header h1 {
                font-size: 1.8rem;
            }

            .kpi-card .value {
                font-size: 1.8rem;
            }

            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>SOORGA Company KPIs</h1>
            <p class="timestamp" id="timestamp">Loading...</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('platform')">Platform Overview</button>
            <button class="tab-btn" onclick="showTab('users')">User Analytics</button>
        </div>

        <!-- Platform Tab -->
        <div id="platform-tab" class="tab-content active">
            <div id="platform-content">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading platform analytics...</p>
                </div>
            </div>
        </div>

        <!-- Users Tab -->
        <div id="users-tab" class="tab-content">
            <div id="users-content">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading user analytics...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token || role !== 'admin') {
            window.location.href = '/admin/login.html';
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

            document.querySelector(`[onclick="showTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');

            if (tabName === 'users' && !usersLoaded) {
                loadUserAnalytics();
            }
        }

        let usersLoaded = false;

        function getAPIBase() {
            return window.CONFIG?.API_BASE
                ? window.CONFIG.API_BASE.replace('/api', '')
                : 'http://localhost:3000';
        }

        // Load Platform KPIs
        async function loadPlatformKPIs() {
            const contentEl = document.getElementById('platform-content');
            const timestampEl = document.getElementById('timestamp');

            try {
                const response = await fetch(`${getAPIBase()}/api/analytics/kpis`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to fetch KPIs');

                const data = await response.json();
                const kpis = data.kpis;

                timestampEl.textContent = `Last updated: ${new Date(data.timestamp).toLocaleString()}`;

                contentEl.innerHTML = `
                    <h2 class="section-title">Core Value Metrics</h2>
                    <div class="kpi-grid">
                        <div class="kpi-card highlight">
                            <div class="label">Posts Generated</div>
                            <div class="value">${kpis.postGeneration.totalPosts}</div>
                            <div class="subtext">${kpis.postGeneration.recentPosts} in last 7 days</div>
                        </div>
                        <div class="kpi-card">
                            <div class="label">Signal Conversion</div>
                            <div class="value">${kpis.signalConversion.conversionRate}%</div>
                            <div class="subtext">${kpis.signalConversion.uniqueSignalsUsed}/${kpis.signalDiscovery.totalSignals} signals used</div>
                        </div>
                        <div class="kpi-card">
                            <div class="label">Visual Attachment</div>
                            <div class="value">${kpis.visualGeneration.attachmentRate}%</div>
                            <div class="subtext">${kpis.visualGeneration.postsWithImages} with images</div>
                        </div>
                        <div class="kpi-card">
                            <div class="label">Publishing Rate</div>
                            <div class="value">${kpis.publishing.publishingRate}%</div>
                            <div class="subtext">${kpis.publishing.postsPosted} published</div>
                        </div>
                    </div>

                    <h2 class="section-title">User Acquisition</h2>
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <div class="label">Total Users</div>
                            <div class="value">${kpis.userMetrics.totalUsers}</div>
                            <div class="subtext">${kpis.userMetrics.activeUsers} active</div>
                        </div>
                        <div class="kpi-card">
                            <div class="label">Activation Rate</div>
                            <div class="value">${kpis.userMetrics.activationRate}%</div>
                            <div class="subtext">Created at least 1 post</div>
                        </div>
                        <div class="kpi-card">
                            <div class="label">Posts per User</div>
                            <div class="value">${kpis.postGeneration.postsPerUser}</div>
                            <div class="subtext">Average per active user</div>
                        </div>
                    </div>

                    <h2 class="section-title">LinkedIn Engagement</h2>
                    <div class="kpi-grid">
                        <div class="kpi-card">
                            <div class="label">Impressions</div>
                            <div class="value">${kpis.engagement.totalImpressions.toLocaleString()}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="label">Reactions</div>
                            <div class="value">${kpis.engagement.totalReactions.toLocaleString()}</div>
                        </div>
                        <div class="kpi-card">
                            <div class="label">Comments</div>
                            <div class="value">${kpis.engagement.totalComments.toLocaleString()}</div>
                        </div>
                    </div>

                    <div style="text-align: center; margin-top: 30px;">
                        <button class="refresh-btn" onclick="loadPlatformKPIs()">🔄 Refresh</button>
                    </div>
                `;
            } catch (error) {
                contentEl.innerHTML = `<div class="error"><h3>Error loading data</h3><p>${error.message}</p></div>`;
            }
        }

        // Load User Analytics
        async function loadUserAnalytics() {
            const contentEl = document.getElementById('users-content');

            try {
                const response = await fetch(`${getAPIBase()}/api/analytics/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to fetch user analytics');

                const data = await response.json();
                usersLoaded = true;

                contentEl.innerHTML = `
                    <h2 class="section-title">Conversion Funnel</h2>
                    <div class="summary-cards">
                        <div class="summary-card">
                            <div class="number" style="color: #48bb78;">${data.summary.highPotential}</div>
                            <div class="text">High Potential</div>
                        </div>
                        <div class="summary-card">
                            <div class="number" style="color: #ed8936;">${data.summary.mediumPotential}</div>
                            <div class="text">Medium Potential</div>
                        </div>
                        <div class="summary-card">
                            <div class="number" style="color: #a0aec0;">${data.summary.lowPotential}</div>
                            <div class="text">Low Potential</div>
                        </div>
                        <div class="summary-card">
                            <div class="number">${data.summary.totalUsers}</div>
                            <div class="text">Total Users</div>
                        </div>
                    </div>

                    <h2 class="section-title">User Activity Status</h2>
                    <div class="summary-cards">
                        <div class="summary-card">
                            <div class="number" style="color: #48bb78;">${data.summary.activeUsers}</div>
                            <div class="text">Active (7 days)</div>
                        </div>
                        <div class="summary-card">
                            <div class="number" style="color: #4299e1;">${data.summary.engagedUsers}</div>
                            <div class="text">Engaged (30 days)</div>
                        </div>
                        <div class="summary-card">
                            <div class="number" style="color: #ed8936;">${data.summary.dormantUsers}</div>
                            <div class="text">Dormant</div>
                        </div>
                        <div class="summary-card">
                            <div class="number" style="color: #a0aec0;">${data.summary.inactiveUsers}</div>
                            <div class="text">Never Active</div>
                        </div>
                    </div>

                    <h2 class="section-title">All Users (Sorted by Conversion Potential)</h2>
                    <div class="users-table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Email</th>
                                    <th>Signup</th>
                                    <th>Posts</th>
                                    <th>Images</th>
                                    <th>Published</th>
                                    <th>Engagement</th>
                                    <th>Score</th>
                                    <th>Potential</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.users.map(user => `
                                    <tr>
                                        <td>${user.email}</td>
                                        <td>${new Date(user.signupDate).toLocaleDateString()}</td>
                                        <td>${user.totalPosts}</td>
                                        <td>${user.postsWithImages} (${user.imageRate}%)</td>
                                        <td>${user.postsPublished} (${user.publishRate}%)</td>
                                        <td>${user.totalImpressions} imp / ${user.totalReactions} react</td>
                                        <td>
                                            <div class="score-bar">
                                                <div class="score-fill" style="width: ${user.engagementScore}%"></div>
                                            </div>
                                            ${user.engagementScore}
                                        </td>
                                        <td>
                                            <span class="badge badge-${user.conversionPotential.toLowerCase()}">${user.conversionPotential}</span>
                                        </td>
                                        <td>
                                            <span class="badge badge-${user.status.toLowerCase()}">${user.status}</span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div style="text-align: center; margin-top: 30px;">
                        <button class="refresh-btn" onclick="loadUserAnalytics()">🔄 Refresh</button>
                    </div>
                `;
            } catch (error) {
                contentEl.innerHTML = `<div class="error"><h3>Error loading data</h3><p>${error.message}</p></div>`;
            }
        }

        // Load platform KPIs on page load
        loadPlatformKPIs();
    </script>
</body>
</html>
