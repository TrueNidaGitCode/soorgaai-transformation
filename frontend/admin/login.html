<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin sign-in for the Svarg platform">

    <title>Admin Sign In - Svarg</title>

    <!--
      login.css, not admin.css. Every class this page uses — .login-page,
      .login-container, .login-header, .bg-circle, .login-button — is defined
      only in login/login.css, so loading admin.css here rendered the same
      markup as the customer sign-in with none of its styling. admin.css
      styles dashboards; it has no login rules at all.

      .cta-button comes from style.css, which both pages load. Same two
      stylesheets as login/login.html, in the same order, on purpose.
    -->
    <link rel="stylesheet" href="../login/login.css?v=2">
    <link rel="stylesheet" href="../style.css">
    <script src="../login/config.js"></script>
</head>
<body data-nav-mode="login">
    <main class="login-page">
        <div class="login-container">
            <!-- Brand/Logo Section -->
            <div class="login-header">
                <img src="/assets/Logo.png" alt="Svarg" class="login-logo">
                <p class="login-subtitle">Sign in to the admin portal</p>
            </div>

            <!-- Admin Login Form -->
            <form id="admin-login-form" class="auth-form">
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                        autofocus
                    >
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        minlength="6"
                    >
                    <div class="password-hint">Minimum 6 characters</div>
                </div>

                <!-- Error Message Display -->
                <div id="error-message" class="error-message" style="display: none;"></div>

                <!-- Submit Button -->
                <button type="submit" id="login-button" class="cta-button login-button">
                    <span class="button-text">Sign In</span>
                    <span class="button-loader" style="display: none;">
                        <span class="spinner-small"></span>
                        Signing in...
                    </span>
                </button>

                <!-- Helper Text -->
                <p class="auth-note">
                    Admin access only. Contact support if you need help.
                </p>
            </form>

            <!-- Back to Home Link -->
            <div class="login-footer">
                <a href="/index.html" class="back-link">← Back to Home</a>
            </div>
        </div>

        <!-- Decorative Background Elements -->
        <div class="login-background">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>
    </main>

    <script src="login.js" defer></script>
</body>
</html>
