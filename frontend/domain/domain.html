<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoorgaAI — AI Strategy</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="domain.css">
  <script src="../login/config.js"></script>
</head>
<body class="domain-page">

  <!-- ── Navbar ──────────────────────────────────────────────────────────── -->
  <nav class="workspace-nav" aria-label="Workspace navigation">
    <div class="workspace-nav__left">
      <a href="/workspace/workspace.html" class="workspace-nav__back" aria-label="Back to workspace">← Workspace</a>
      <span class="workspace-nav__logo">SOORGA<span>AI</span></span>
    </div>
    <div class="workspace-nav__right">
      <span id="domain-title-nav" class="workspace-nav__domain-title"></span>
      <button id="domain-logout" class="workspace-nav__logout">Logout</button>
    </div>
  </nav>

  <!-- ── Loading ─────────────────────────────────────────────────────────── -->
  <div id="domain-loading" class="ws-loading" aria-live="polite">
    <div class="ws-spinner"></div>
    <p>Loading your workspace…</p>
  </div>

  <!-- ── Two-panel layout ────────────────────────────────────────────────── -->
  <main id="domain-main" class="domain-main" style="display:none" aria-label="Domain workspace">

    <!-- Canvas panel -->
    <section class="canvas-panel" aria-labelledby="canvas-heading">
      <h2 id="canvas-heading" class="panel-heading">AI Strategy Canvas</h2>
      <p class="panel-subheading" id="canvas-subheading">Select a capability to explore its blueprint.</p>
      <div id="canvas-content" class="canvas-content">
        <!-- Injected by strategy-canvas.js -->
      </div>
    </section>

    <!-- Advisor panel -->
    <section class="chat-panel" aria-labelledby="advisor-heading">
      <div class="advisor-panel-header">
        <h2 id="advisor-heading" class="panel-heading">AI Strategy Advisor</h2>
        <div id="advisor-context" class="advisor-context-badge" style="display:none" aria-live="polite">
          <!-- Injected by advisor.js: "AI Initiative Leadership · Automotive" -->
        </div>
      </div>
      <p id="advisor-subheading" class="panel-subheading">Select a capability from the canvas to start asking questions.</p>

      <!-- Sprint 16: Active section context panel -->
      <div id="section-context" class="section-context" style="display:none" aria-live="polite">
        <div class="section-context__header">
          <div class="section-context__info">
            <span class="section-context__label">EDITING SECTION</span>
            <span id="section-context-title" class="section-context__title"></span>
          </div>
          <button id="section-context-clear" class="section-context__clear" aria-label="Clear section selection">Clear</button>
        </div>
        <p id="section-context-preview" class="section-context__preview"></p>
      </div>

      <!-- Sprint 16: Section-specific quick prompts -->
      <div id="section-prompts" class="suggested-prompts" style="display:none" aria-label="Section quick actions">
        <!-- Injected by advisor.js when a section is selected -->
      </div>

      <!-- Suggested prompts -->
      <div id="suggested-prompts" class="suggested-prompts" aria-label="Suggested questions">
        <!-- Injected by advisor.js -->
      </div>

      <!-- Chat messages -->
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite">
        <!-- Injected by chat.js -->
      </div>

      <!-- Error banner -->
      <div id="chat-error" class="chat-error" style="display:none" role="alert">
        <span id="chat-error-text">We couldn't process that. Please try again.</span>
        <button id="chat-retry" class="chat-retry-btn">Retry</button>
      </div>

      <!-- Input -->
      <form id="chat-form" class="chat-input-form" novalidate>
        <textarea
          id="chat-input"
          class="chat-input"
          rows="3"
          placeholder="Type your message…"
          aria-label="Chat message"
        ></textarea>
        <button type="submit" id="chat-send" class="chat-send-btn" aria-label="Send message">
          <span id="chat-send-icon">→</span>
          <span id="chat-send-loader" class="chat-send-loader" style="display:none"></span>
        </button>
      </form>

    </section>
  </main>

  <script type="module" src="strategy-canvas.js"></script>
  <script type="module" src="advisor.js"></script>
</body>
</html>
