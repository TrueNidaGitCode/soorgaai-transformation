<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SOORGA</title>

    <!-- Use same styles as login page -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../style.css">

    <script src="config.js"></script>
</head>
<body>
    <!-- Match login page structure -->
    <main class="login-page">
        <div class="login-container">
            <!-- Brand/Logo Section -->
            <div class="login-header">
                <h1 class="brand-title">SOORGA</h1>
                <p class="login-subtitle">Reset your password</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgot-password-form" class="auth-form">
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                        autofocus
                    >
                </div>

                <!-- Error/Success Message -->
                <div id="message" class="error-message" style="display: none;"></div>

                <!-- Submit Button -->
                <button type="submit" id="reset-button" class="cta-button login-button">
                    <span class="button-text">Send Reset Link</span>
                    <span class="button-loader" style="display: none;">
                        <span class="spinner-small"></span>
                        Sending...
                    </span>
                </button>

                <!-- Helper Text -->
                <p class="auth-note">
                    We'll send you a link to reset your password
                </p>
            </form>

            <!-- Back to Login Link -->
            <div class="login-footer">
                <a href="login.html" class="back-link">← Back to Login</a>
            </div>
        </div>

        <!-- Decorative Background Elements -->
        <div class="login-background">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>
    </main>

    <script src="forgot-password.js"></script>
</body>
</html>
