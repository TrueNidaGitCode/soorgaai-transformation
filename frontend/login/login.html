<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO meta description -->
    <meta name="description" content="Login to SOORGA - Access your signals dashboard and generated LinkedIn posts">
    
    <title>Login - SOORGA</title>
    
    <!-- 
      Stylesheets
      - login.css: Login page specific styles
      - ../style.css: Global styles and variables
    -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../style.css">

    <!-- 
      Configuration file - MUST load first
      Contains all API endpoints and environment configuration
      Loaded before other scripts so CONFIG is available globally
    -->
    <script src="config.js"></script>
    <!-- ✅ Add mock data for testing -->
    <!-- <script src="/mock-data.js"></script> -->
</head>
<body data-nav-mode="login">
    <!--
      Header with dynamic navbar
      Navbar component will be injected here (optional for login page)
    -->
    <header>
        <div id="navbar-container"></div>
    </header>

    <!-- 
      Main Login Container
      Centered authentication form
    -->
    <main class="login-page">
        <div class="login-container">
            <!-- Brand/Logo Section -->
            <div class="login-header">
                <h1 class="brand-title">SOORGA</h1>
                <p class="login-subtitle">Sign in to access your signals</p>
            </div>

            <!-- ── Social login ──────────────────────────────── -->
            <div class="oauth-btns">
              <button type="button" id="btn-google" class="oauth-btn" aria-label="Continue with Google">
                <svg class="oauth-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
              </button>

              <button type="button" id="btn-microsoft" class="oauth-btn" aria-label="Continue with Microsoft">
                <svg class="oauth-icon" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <rect x="1"  y="1"  width="10" height="10" fill="#F25022"/>
                  <rect x="12" y="1"  width="10" height="10" fill="#7FBA00"/>
                  <rect x="1"  y="12" width="10" height="10" fill="#00A4EF"/>
                  <rect x="12" y="12" width="10" height="10" fill="#FFB900"/>
                </svg>
                Continue with Microsoft
              </button>
            </div>

            <!-- ── Divider ─────────────────────────────────── -->
            <div class="auth-divider" role="separator"><span>OR</span></div>

            <!--
              Login Form
              Handles both login and registration (auto-detect)
              Backend determines if email exists or needs new account
            -->
            <form id="login-form" class="auth-form">
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="your@email.com"
                        required 
                        autocomplete="email"
                        autofocus
                    >
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required 
                        autocomplete="current-password"
                        minlength="6"
                    >
                    <div class="password-hint">Minimum 6 characters</div>
                </div>

                <!-- ✅ Forgot Password Link -->
                <div class="forgot-password-link" style="text-align: right; margin: -10px 0 15px 0;">
                    <a href="forgot-password.html" style="color: var(--primary-color, #5CC5A7); font-size: 14px; text-decoration: none;">
                        Forgot Password?
                    </a>
                </div>

                <!--
                  Error Message Display
                  Hidden by default, shown when login fails
                -->
                <div id="error-message" class="error-message" style="display: none;"></div>

                <!-- 
                  Submit Button
                  Shows loading state during authentication
                -->
                <button type="submit" id="login-button" class="cta-button login-button">
                    <span class="button-text">Continue</span>
                    <span class="button-loader" style="display: none;">
                        <span class="spinner-small"></span>
                        Signing in...
                    </span>
                </button>

                <!--
                  Signup Link
                  Navigate to signup page for new users
                -->
                <p class="auth-note">
                    New user? <a href="/signup/signup.html" style="color: var(--primary-color, #5CC5A7); text-decoration: none; font-weight: 600;">Create an account</a>
                </p>
            </form>

            <!-- 
              Back to Home Link
              Alternative navigation option
            -->
            <div class="login-footer">
                <a href="/index.html" class="back-link">← Back to Home</a>
            </div>
        </div>

        <!-- 
          Decorative Background Elements
          Optional visual enhancement
        -->
        <div class="login-background">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>
    </main>

    <!-- 
      Script Loading Order:
      1. config.js - Loaded first (synchronously above) to make CONFIG available
      2. navbar.js - Injects navigation (optional for login page)
      3. login.js - Handles form submission and authentication
    -->
    <script type="module" src="../navbar/navbar.js"></script>

    <!-- OAuth button handlers: save pending redirect then navigate to backend -->
    <script>
      (function () {
        function getPendingRedirect() {
          var p = new URLSearchParams(window.location.search).get('redirect');
          return (p && p.startsWith('/') && !p.startsWith('//')) ? p : null;
        }

        function goOAuth(providerUrl) {
          var pending = getPendingRedirect();
          if (pending) {
            try { localStorage.setItem('redirectAfterLogin', pending); } catch(e){}
          }
          window.location.href = providerUrl;
        }

        document.addEventListener('DOMContentLoaded', function () {
          var cfg = window.CONFIG && window.CONFIG.AUTH && window.CONFIG.AUTH.OAUTH;
          if (!cfg) return;

          var btnG = document.getElementById('btn-google');
          var btnM = document.getElementById('btn-microsoft');

          if (btnG) btnG.addEventListener('click', function () { goOAuth(cfg.GOOGLE); });
          if (btnM) btnM.addEventListener('click', function () { goOAuth(cfg.MICROSOFT); });
        });
      })();
    </script>

    <script src="login.js" defer></script>
</body>
</html>
