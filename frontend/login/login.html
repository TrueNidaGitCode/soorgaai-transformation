<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO meta description -->
    <meta name="description" content="Login to SOORGA - Access your signals dashboard and generated LinkedIn posts">
    
    <title>Login - SOORGA</title>
    
    <!-- 
      Stylesheets
      - login.css: Login page specific styles
      - ../style.css: Global styles and variables
    -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../style.css">

    <!-- 
      Configuration file - MUST load first
      Contains all API endpoints and environment configuration
      Loaded before other scripts so CONFIG is available globally
    -->
    <script src="config.js"></script>
    <!-- ✅ Add mock data for testing -->
    <!-- <script src="/mock-data.js"></script> -->
</head>
<body>
    <!-- 
      Header with dynamic navbar
      Navbar component will be injected here (optional for login page)
    -->
    <header>
        <div id="navbar-container"></div>
    </header>

    <!-- 
      Main Login Container
      Centered authentication form
    -->
    <main class="login-page">
        <div class="login-container">
            <!-- Brand/Logo Section -->
            <div class="login-header">
                <h1 class="brand-title">SOORGA</h1>
                <p class="login-subtitle">Sign in to access your signals</p>
            </div>

            <!-- 
              Login Form
              Handles both login and registration (auto-detect)
              Backend determines if email exists or needs new account
            -->
            <form id="login-form" class="auth-form">
                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="your@email.com"
                        required 
                        autocomplete="email"
                        autofocus
                    >
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required 
                        autocomplete="current-password"
                        minlength="6"
                    >
                    <div class="password-hint">Minimum 6 characters</div>
                </div>

                <!-- ✅ Forgot Password Link -->
                <div class="forgot-password-link" style="text-align: right; margin: -10px 0 15px 0;">
                    <a href="forgot-password.html" style="color: var(--primary-color, #5CC5A7); font-size: 14px; text-decoration: none;">
                        Forgot Password?
                    </a>
                </div>

                <!--
                  Error Message Display
                  Hidden by default, shown when login fails
                -->
                <div id="error-message" class="error-message" style="display: none;"></div>

                <!-- 
                  Submit Button
                  Shows loading state during authentication
                -->
                <button type="submit" id="login-button" class="cta-button login-button">
                    <span class="button-text">Continue</span>
                    <span class="button-loader" style="display: none;">
                        <span class="spinner-small"></span>
                        Signing in...
                    </span>
                </button>

                <!--
                  Signup Link
                  Navigate to signup page for new users
                -->
                <p class="auth-note">
                    New user? <a href="/signup/signup.html" style="color: var(--primary-color, #5CC5A7); text-decoration: none; font-weight: 600;">Create an account</a>
                </p>
            </form>

            <!-- 
              Back to Home Link
              Alternative navigation option
            -->
            <div class="login-footer">
                <a href="/index.html" class="back-link">← Back to Home</a>
            </div>
        </div>

        <!-- 
          Decorative Background Elements
          Optional visual enhancement
        -->
        <div class="login-background">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>
    </main>

    <!-- 
      Script Loading Order:
      1. config.js - Loaded first (synchronously above) to make CONFIG available
      2. navbar.js - Injects navigation (optional for login page)
      3. login.js - Handles form submission and authentication
    -->
    <script src="../navbar/navbar.js" defer></script>
    <script src="login.js" defer></script>
</body>
</html>
