<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SOORGA</title>

    <!-- Use same styles as login page -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../style.css">

    <script src="config.js"></script>
</head>
<body>
    <!-- Match login page structure -->
    <main class="login-page">
        <div class="login-container">
            <!-- Brand/Logo Section -->
            <div class="login-header">
                <h1 class="brand-title">SOORGA</h1>
                <p class="login-subtitle">Create a new password</p>
            </div>

            <!-- Reset Password Form -->
            <form id="reset-password-form" class="auth-form">
                <input type="hidden" id="email" name="email">
                <input type="hidden" id="token" name="token">

                <!-- New Password Input -->
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input
                        type="password"
                        id="new-password"
                        name="new-password"
                        placeholder="Enter new password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        autofocus
                    >
                    <div class="password-hint">Minimum 6 characters</div>
                </div>

                <!-- Confirm Password Input -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm new password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <!-- Error/Success Message -->
                <div id="message" class="error-message" style="display: none;"></div>

                <!-- Submit Button -->
                <button type="submit" id="reset-button" class="cta-button login-button">
                    <span class="button-text">Reset Password</span>
                    <span class="button-loader" style="display: none;">
                        <span class="spinner-small"></span>
                        Resetting...
                    </span>
                </button>

                <!-- Helper Text -->
                <p class="auth-note">
                    Your password will be updated immediately
                </p>
            </form>

            <!-- Back to Login Link -->
            <div class="login-footer">
                <a href="login.html" class="back-link">← Back to Login</a>
            </div>
        </div>

        <!-- Decorative Background Elements -->
        <div class="login-background">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>
    </main>

    <script src="reset-password.js"></script>
</body>
</html>
