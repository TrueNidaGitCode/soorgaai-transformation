<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoorgaAI — AI Transformation Workspace</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="workspace.css">
  <script src="../login/config.js"></script>
</head>
<body class="workspace-page">

  <!-- ── Workspace Navbar ────────────────────────────────────────────────── -->
  <nav class="workspace-nav" aria-label="Workspace navigation">
    <div class="workspace-nav__logo">SOORGA<span>AI</span></div>
    <div class="workspace-nav__right">
      <span id="ws-username" class="workspace-nav__username"></span>
      <button id="ws-logout" class="workspace-nav__logout">Logout</button>
    </div>
  </nav>

  <!-- ── Loading state ───────────────────────────────────────────────────── -->
  <div id="ws-loading" class="ws-loading" aria-live="polite">
    <div class="ws-spinner"></div>
    <p>Loading your workspace…</p>
  </div>

  <!-- ── Main workspace ──────────────────────────────────────────────────── -->
  <main id="ws-main" class="workspace-main" style="display:none">

    <h1 class="ws-page-title">AI Transformation Workspace</h1>

    <!-- User info card -->
    <div class="ws-card ws-user-card">
      <p class="ws-brand-label">SoorgaAI</p>
      <p class="ws-welcome-heading">Welcome, <span id="ws-welcome-name"></span></p>
      <p id="ws-user-context" class="ws-user-context"></p>
    </div>

    <!-- Company AI Strategy Dashboard link (Sprint 18) -->
    <a class="ws-card ws-strategy-card" href="/company-strategy/company-strategy.html" aria-label="Open Company AI Strategy dashboard">
      <div>
        <h2 class="ws-strategy-card__title">Company AI Strategy</h2>
        <p class="ws-strategy-card__description">Executive view of your evolving AI blueprint — progress, capabilities, and next steps.</p>
      </div>
      <span class="ws-strategy-card__arrow" aria-hidden="true">→</span>
    </a>

    <!-- Domains card -->
    <div class="ws-card ws-domains-card">
      <h2 class="ws-domains-title">Transformation Domains</h2>
      <section class="domain-grid" aria-label="Transformation domains">
        <!-- Injected by workspace.js -->
      </section>
    </div>

  </main>

  <script type="module" src="workspace.js"></script>
</body>
</html>
