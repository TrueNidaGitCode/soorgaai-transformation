<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoorgaAI — AI Transformation Workspace</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="workspace.css">
  <script src="../login/config.js"></script>
</head>
<body class="workspace-page">

  <!-- ── Workspace Navbar ────────────────────────────────────────────────── -->
  <nav class="workspace-nav" aria-label="Workspace navigation">
    <div class="workspace-nav__logo">SOORGA<span>AI</span></div>
    <div class="workspace-nav__right">
      <span id="ws-username" class="workspace-nav__username"></span>
      <button id="ws-logout" class="workspace-nav__logout">Logout</button>
    </div>
  </nav>

  <!-- ── Loading state ───────────────────────────────────────────────────── -->
  <div id="ws-loading" class="ws-loading" aria-live="polite">
    <div class="ws-spinner"></div>
    <p>Loading your workspace…</p>
  </div>

  <!-- ── Main workspace ──────────────────────────────────────────────────── -->
  <main id="ws-main" class="workspace-main" style="display:none">

    <h1 class="ws-page-title">AI Transformation Workspace</h1>

    <!-- User info card -->
    <div class="ws-card ws-user-card">
      <p class="ws-brand-label">SoorgaAI</p>
      <p class="ws-welcome-heading">Welcome, <span id="ws-welcome-name"></span></p>
      <p id="ws-user-context" class="ws-user-context"></p>
    </div>

    <!-- Your AI Transformation — personal progress widget (Sprint 18.1) -->
    <section id="ws-transform-card" class="ws-card ws-transform-card" role="button" tabindex="0"
             aria-label="Continue your AI transformation where you left off">
      <div class="ws-transform-card__header">
        <div>
          <h2 class="ws-transform-card__title">Your AI Transformation</h2>
          <p class="ws-transform-card__subtitle">Track your company's AI transformation journey and continue where you left off.</p>
        </div>
        <span id="ws-transform-continue" class="ws-transform-card__continue" aria-hidden="true">Continue →</span>
      </div>
      <div id="ws-transform-body">
        <!-- Injected by yourTransformation.js -->
      </div>
    </section>

    <!-- Domains card -->
    <div class="ws-card ws-domains-card">
      <h2 class="ws-domains-title">Transformation Domains</h2>
      <section class="domain-grid" aria-label="Transformation domains">
        <!-- Injected by workspace.js -->
      </section>
    </div>

  </main>

  <script type="module" src="workspace.js"></script>
  <script type="module" src="yourTransformation.js"></script>
</body>
</html>
