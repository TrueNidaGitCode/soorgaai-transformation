# SoorgaAI — Nixpacks configuration for Railway
# Node.js 20 to match .node-version

[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = ['cd backend/trunida-backend && npm install']

[phases.build]
cmds = ['echo "SoorgaAI backend ready"']

[start]
cmd = 'cd backend/trunida-backend && npm start'

